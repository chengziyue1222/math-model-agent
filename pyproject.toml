[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-model-agent"
version = "6.5.0"
description = "Mathematical-modeling algorithm library used by the Math Model Agent repository"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "networkx>=2.6",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["algorithms*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"code/algorithms/__init__.py" = ["F401"]
